<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Kim Long EcoStay — Đang điều hướng...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // Giữ lại tên repo: /KimLongEcoStay/

      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var cleanRedirect = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        path +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      
      l.replace(cleanRedirect);
    </script>
  </head>
  <body style="background: #0A3D2C; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #D4AF37;">🌿 Kim Long EcoStay</h2>
      <p>Đang tải trang, vui lòng chờ trong giây lát...</p>
    </div>
  </body>
</html>
